name: Rollback Database
on:
  workflow_dispatch:
    inputs:
      backup_object:
        description: 'Private object path: production/...tar.gz.enc or legacy/...zip.enc'
        required: true
        type: string
      confirm_rollback:
        description: 'Type RESTORE PRODUCTION to overwrite current application data'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  rollback:
    name: Restore verified private backup
    runs-on: ubuntu-latest
    environment: production-recovery
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify confirmation
        env:
          CONFIRM_ROLLBACK: ${{ inputs.confirm_rollback }}
        run: test "$CONFIRM_ROLLBACK" = 'RESTORE PRODUCTION'
      - name: Install matching PostgreSQL client
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/install-pg-client.sh
      - name: Download, authenticate and restore
        env:
          BACKUP_OBJECT: ${{ inputs.backup_object }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          node scripts/private-backup.mjs download "$BACKUP_OBJECT" "$work/archive"
          python3 scripts/extract-private-backup.py "$work/archive" "$work/extracted"
          if ! python3 scripts/pg-with-url.py psql -X -v ON_ERROR_STOP=1 --single-transaction --file "$work/extracted/backup.sql" > "$work/restore.log" 2>&1; then
            echo 'Restore failed and transaction was rolled back. SQL output withheld from public logs.' >&2
            exit 1
          fi
          python3 scripts/pg-with-url.py psql -X -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"
          echo 'Private backup authenticated and application database restored. Verify compatible app version.'
