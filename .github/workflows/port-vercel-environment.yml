name: One-time approved Vercel environment transfer
on:
  push:
    branches: [codex/cloud-panel-migration]
    paths:
      - .github/workflows/port-vercel-environment.yml
      - scripts/port-vercel-environment.mjs
permissions:
  contents: read
concurrency:
  group: approved-production-environment-transfer
  cancel-in-progress: false
jobs:
  transfer:
    if: github.repository == 'codescribblr/budget-app' && github.ref == 'refs/heads/codex/cloud-panel-migration'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Send encrypted production settings to the existing private Cloud Panel store
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          CLOUD_BACKUP_URL: ${{ vars.CLOUD_BACKUP_URL }}
          CLOUD_BACKUP_APP_ID: ${{ vars.CLOUD_BACKUP_APP_ID }}
          CLOUD_BACKUP_TOKEN: ${{ secrets.CLOUD_BACKUP_TOKEN }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: node scripts/port-vercel-environment.mjs
