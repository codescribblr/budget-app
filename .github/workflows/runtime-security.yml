name: Runtime Security Checks
on:
  pull_request:
    paths: [package.json, package-lock.json, .github/workflows/runtime-security.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://staging-disabled.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: staging-placeholder
      SUPABASE_SERVICE_ROLE_KEY: staging-placeholder
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm rebuild better-sqlite3 sharp
      - run: npm audit --omit=dev --audit-level=high
      - run: npx tsc --noEmit
      - name: Run Vitest suites (the repository also has separate Node test files)
        run: |
          python3 - <<'PY'
          import pathlib,re,subprocess
          files=[str(p) for p in pathlib.Path('src').rglob('*.test.ts') if re.search(r'from [\'\"]vitest[\'\"]',p.read_text())]
          subprocess.run(['npx','vitest','run','--maxWorkers=2',*files],check=True)
          PY
      - run: npm run build
