name: Deploy to Production

on:
  push:
    branches:
      - main

# Use Node 24 for JavaScript-based actions (see GitHub Actions Node 20 deprecation).
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Never overlap schema/application transitions from separate pushes.
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  migrate-and-deploy:
    if: vars.PRODUCTION_HOST != 'cloud-panel'
    name: Run Migrations & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: Set up Node for private backups
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install matching PostgreSQL client
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/install-pg-client.sh

      - name: 🔍 Check for pending migrations
        id: check_migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set +e
          bash scripts/check-pending-migrations.sh
          status=$?
          set -e
          case "$status" in
            0) echo "has_pending=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "has_pending=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "Migration status check failed; deployment stopped" >&2; exit 1 ;;
          esac

      - name: Create and verify private encrypted backup
        id: backup
        if: steps.check_migrations.outputs.has_pending == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_STORAGE_BACKEND: ${{ vars.BACKUP_STORAGE_BACKEND || 'supabase' }}
          CLOUD_BACKUP_URL: ${{ vars.CLOUD_BACKUP_URL }}
          CLOUD_BACKUP_APP_ID: ${{ vars.CLOUD_BACKUP_APP_ID }}
          CLOUD_BACKUP_TOKEN: ${{ secrets.CLOUD_BACKUP_TOKEN }}
        run: bash scripts/create-private-backup.sh

      - name: 🔄 Run database migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          chmod +x scripts/run-migrations.sh
          ./scripts/run-migrations.sh

      # v25 bundled an old CLI and often failed with npx exit 1; v42 tracks current Vercel CLI.
      # vercel.json disables the separate main-branch Git deployment so the
      # production release cannot race ahead of the database migrations.
      - name: 🚀 Deploy to Vercel
        uses: amondnet/vercel-action@v42.2.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

      - name: 🔄 Finalize post-deploy migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: ./scripts/run-migrations.sh --post-deploy

      - name: ✅ Deployment complete
        run: |
          echo "🎉 Deployment completed successfully!"
          if [ "${{ steps.check_migrations.outputs.has_pending }}" == "true" ]; then
            echo "Database backup encrypted, stored privately and verified by download"
          fi
          echo "📊 Migrations applied"
          echo "🌐 Application deployed to Vercel"


